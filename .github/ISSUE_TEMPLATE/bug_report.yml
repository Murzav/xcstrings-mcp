name: Bug Report
description: Report a bug in xcstrings-mcp
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
      placeholder: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Run `parse_xcstrings(path: "...")`
        2. Run `get_untranslated(locale: "...")`
        3. See error...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "Output of `xcstrings-mcp --version`"
      placeholder: "1.1.0"
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: MCP Client
      options:
        - Claude Code
        - Cursor
        - VS Code + Copilot
        - Windsurf
        - Zed
        - OpenAI Codex
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: Any relevant error messages or logs
      render: shell
